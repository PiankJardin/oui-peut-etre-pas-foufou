html,body{height:100%}

body{margin:0}

body{background-color:var(--bg);background-image:radial-gradient(circle,var(--dot) 5px,transparent 5.5px),radial-gradient(circle,var(--dot2) 5px,transparent 5.5px);background-size:36px 36px;background-position:0 0,18px 18px;color:var(--ink);font-family:var(--body);font-size:17px;overflow-x:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.app{overflow-x:clip;max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:14px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.card{position:relative;flex:1;min-height:250px;display:flex;flex-direction:column;background:var(--surface);border:2px solid var(--oui);border-radius:3px;box-shadow:6px 6px 0 var(--oui);overflow:hidden;width:calc(100% - 6px);text-align:left;padding:11px 11px 0;transition:transform .36s cubic-bezier(.4,0,.7,.4),opacity .36s}

@keyframes in{from{transform:translateY(16px) scale(.97);opacity:0}}
.card.oui{transform:translateX(120%) rotate(14deg);opacity:0}
.card.bof{transform:translateY(-110%) rotate(-3deg);opacity:0}
.card.non{transform:translateX(-120%) rotate(-14deg);opacity:0}
.photo{position:relative;flex:1;min-height:120px;border-radius:3px;overflow:hidden}
.photo svg,.photo img{position:absolute;inset:0;width:100%;height:100%;max-width:100%}

#card{cursor:pointer}

.slides{overscroll-behavior-x:contain;position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}

.dot{flex:none;width:22px;height:20px;clip-path:path("M11 19C4 13.5 1 10 1 6a5 5 0 0 1 10-1.5A5 5 0 0 1 21 6c0 4-3 7.5-10 13z")}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mini{background:var(--soft);border-radius:4px;overflow:hidden;text-align:left;padding:6px 6px 0;display:flex;flex-direction:column}
.mini .photo{flex:none;height:104px;min-height:0}

.empty{font-size:14px;color:var(--muted);margin:0}
.done{background:var(--surface);border:2px solid var(--oui);border-radius:3px;box-shadow:6px 6px 0 var(--oui);padding:26px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.done p{margin:0;color:var(--muted)}
.cta{background:var(--oui);color:var(--on-accent);font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase;padding:12px 22px;border-radius:4px;box-shadow:4px 4px 0 var(--ink)}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column}
.sheet-in{max-width:460px;width:100%;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.close{align-self:flex-end;font-weight:700;padding:6px 10px}
.sheet .card{min-height:300px}
.choice.on{box-shadow:0 0 0 3px var(--ink)}
.reset{align-self:center;font-size:13px;color:var(--ink);text-decoration:underline;padding:4px}
@media (prefers-reduced-motion:reduce){.card,.choice{transition:none}.card.in{animation:none}}
</style>

    $("see").onclick=()=>{view="sel";render()};
  }else{
    $("view").innerHTML=pips+`<div class="card in" id="card" role="button" tabindex="0" aria-label="Agrandir l'annonce">${photo(cur,(cur.imgs?'':'<span class="tag">Exemple</span>')+'<span class="zoom">Toucher pour agrandir</span>',true)}${infos(cur)}</div>`+buttons();
    $("view").insertAdjacentHTML("beforeend",back);
    $("card").onclick=()=>openSheet(cur,true);
    $("card").onkeydown=e=>{if(e.key==="Enter"&&e.target.id==="card")openSheet(cur,true)};
    wire($("view"));
    document.querySelectorAll("#view .choice").forEach(b=>b.onclick=()=>pick(cur,b.dataset.c));
  }
  if($("back"))$("back").onclick=()=>{const id=order.pop();delete choices[id];noter(id,null);render()};
}
function pick(a,c){
  if(busy)return;busy=true;
  const card=$("card");
  card.insertAdjacentHTML("beforeend",`<span class="stamp" style="background:${COLOR[c]}">${LABEL[c]}</span>`);
  setTimeout(()=>card.classList.add(c),170);
  setTimeout(()=>{choices[a.id]=c;order=order.filter(x=>x!==a.id);order.push(a.id);noter(a.id,c);busy=false;render()},540);
}
function renderSel(){
  const groups=Object.keys(LABEL).map(k=>{
    const list=ADS.filter(a=>choices[a.id]===k);
    return `<section class="group"><h2><button class="plier" data-k="${k}" aria-expanded="${!!ouvert[k]}"><span class="dot" style="background:${COLOR[k]}"></span>${LABEL[k]} <span class="count">${list.length}</span><span class="chev" aria-hidden="true">▾</span></button></h2>${!ouvert[k]?"":list.length?`<div class="grid">${list.map(a=>`<button class="mini" data-id="${a.id}">${photo(a)}<span>${a.title}<em>${a.price}</em></span></button>`).join("")}</div>`:`<p class="empty">Rien ici pour l'instant.</p>`}</section>`;
  }).join("");
  $("view").innerHTML=groups;
  document.querySelectorAll(".plier").forEach(b=>b.onclick=()=>{ouvert[b.dataset.k]=!ouvert[b.dataset.k];renderSel()});
  document.querySelectorAll(".mini").forEach(b=>b.onclick=()=>openSheet(ADS.find(a=>a.id===b.dataset.id),false));
}
function openSheet(a,zoomOnly){
  const s=$("sheet");
  s.innerHTML=`<div class="sheet-in"><button class="close" id="close">Fermer</button><div class="card">${photo(a,a.imgs?'':'<span class="tag">Exemple</span>',true)}${infos(a)}</div>${a.url?`<a class="lien" href="${a.url}" target="_blank" rel="noopener">Voir l'annonce complète</a>`:""}${zoomOnly?"":buttons(choices[a.id])}</div>`;
  s.hidden=false;
  wire(s);
  $("close").onclick=()=>{s.hidden=true};
  s.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{choices[a.id]=b.dataset.c;noter(a.id,b.dataset.c);s.hidden=true;render()});
}
$("t-trier").onclick=()=>{view="trier";render()};
$("t-sel").onclick=()=>{view="sel";render()};
render();

const etat=document.createElement("div");etat.className="etat";etat.setAttribute("role","status");etat.hidden=true;
etat.textContent="Pas de réseau : ton choix partira dès que ça revient.";document.body.appendChild(etat);
function montre(){etat.hidden=!Object.keys(attente).length}
function noter(id,c){attente[id]=c;save();if(envoi)relance=true;else flush()}
async function flush(){
  if(envoi)return;envoi=true;
  try{
    for(const id of Object.keys(attente)){
      const c=attente[id];
      const r=c
        ?await fetch(API+"?on_conflict=annonce_id",{method:"POST",headers:{...HD,Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({annonce_id:id,choix:c,maj_le:new Date().toISOString()})})
        :await fetch(API+"?annonce_id=eq."+encodeURIComponent(id),{method:"DELETE",headers:HD});
      if(!r.ok)throw new Error("HTTP "+r.status);
      if(attente[id]===c)delete attente[id];
    }
  }catch(e){}
  envoi=false;save();montre();
  if(relance){relance=false;flush()}
}
const empreinte=o=>JSON.stringify(Object.keys(o).sort().map(k=>[k,o[k]]));
async function charge(){
  try{
    const r=await fetch(API+"?select=annonce_id,choix",{headers:HD});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const n={};
    (await r.json()).forEach(x=>{if(ADS.some(a=>a.id===x.annonce_id))n[x.annonce_id]=x.choix});
    for(const id in attente){if(attente[id])n[id]=attente[id];else delete n[id]}
    if(empreinte(n)!==empreinte(choices)){
      choices=n;order=order.filter(id=>n[id]);Object.keys(n).forEach(id=>{if(!order.includes(id))order.push(id)});save();
      if(!busy&&$("sheet").hidden)render();
    }
  }catch(e){}
}
window.addEventListener("online",flush);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")flush().then(charge)});
flush().then(charge);
</script>
